[project]
name = "gps-hc12-robot"
version = "0.1.0"
description = "WSL2/ROS2 Jazzy ground-station stack for an OpenRB-150 rover using HC-12 wireless UART."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyserial>=3.5",
    "pynmea2>=1.19.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyproj>=3.6",
    "geographiclib>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
web = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests", "gps_coverage_core/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
